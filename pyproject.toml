[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
version = "0.1.0"
description = "MiniCode - minimal agent scaffold."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30",
    "json-repair>=0.20",
    "litellm",
    "openai>=1.30.0",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "rich",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
